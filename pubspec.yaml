name: greenmind_ai

description: GreenMind AI - AI Powered Plant Identification & Smart Care Assistant

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.9.0

  # UI
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.1

  # Image Picker
  image_picker: ^1.2.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Connectivity
  connectivity_plus: ^6.1.5

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Logging
  logger: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/