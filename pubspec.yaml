name: greenmind_ai

description: GreenMind AI - AI Powered Plant Identification & Smart Care Assistant

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

# ==============================================================
# DEPENDENCIES
# ==============================================================

dependencies:
  flutter:
    sdk: flutter

  # ============================================================
  # CORE
  # ============================================================

  cupertino_icons: ^1.0.8

  # ============================================================
  # STATE MANAGEMENT
  # ============================================================

  flutter_riverpod: ^2.6.1

  # ============================================================
  # NAVIGATION
  # ============================================================

  go_router: ^16.0.0

  # ============================================================
  # NETWORKING
  # ============================================================

  dio: ^5.9.0

  # ============================================================
  # UI
  # ============================================================

  google_fonts: ^6.3.0
  flutter_svg: ^2.2.1

  # ============================================================
  # IMAGE
  # ============================================================

  image_picker: ^1.2.0
  image: ^4.8.0

  # ============================================================
  # LOCAL STORAGE
  # ============================================================

  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # ============================================================
  # CONNECTIVITY
  # ============================================================

  connectivity_plus: ^6.1.5

  # ============================================================
  # LOCATION
  # ============================================================

  geolocator: ^14.0.3

  # ============================================================
  # OPENSTREETMAP
  # ============================================================

  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # ============================================================
  # URL / EXTERNAL APPS
  # ============================================================

  url_launcher: ^6.3.2

  # ============================================================
  # UTILITIES
  # ============================================================

  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  logger: ^2.6.1

  # ============================================================
  # FILE PICKER
  # ============================================================

  file_picker: ^12.0.0

  # ============================================================
  # PDF
  # ============================================================

  pdf: ^3.11.3
  printing: ^5.14.2

  # ============================================================
  # NOTIFICATIONS
  # ============================================================

  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

  # ============================================================
  # ALARM
  # ============================================================

  alarm: ^5.4.1

  # ============================================================
  # FIREBASE
  # ============================================================

  firebase_core: ^4.13.0
  firebase_ai: ^3.15.0
  firebase_app_check: ^0.4.6
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

# ==============================================================
# DEV DEPENDENCIES
# ==============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# ==============================================================
# FLUTTER
# ==============================================================

flutter:
  uses-material-design: true

  # ============================================================
  # ASSETS
  # ============================================================

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  # ============================================================
  # APP FONT
  # ============================================================

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400

        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

        - asset: assets/fonts/NotoSans-Italic.ttf
          weight: 400
          style: italic